# 由 `fuyubot-sdk init` 生成：独立插件 crate，**不属于任何 workspace**。
#
# 那个空的 [workspace] 不是多余的：没有它，cargo 会一路往上找父目录里的
# workspace 声明，然后报「current package believes it's in a workspace when it's not」。
[workspace]

[package]
name = "musiccard"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "生成网易云音乐卡片的 FuyuBot 插件"

# 插件必须编成 cdylib：宿主 dlopen 的就是它。
[lib]
crate-type = ["cdylib"]

[dependencies]
fuyubot-plugin-api = "0.1.2"

# 卡片渲染：Chromium-free 的 HTML → PNG（借鉴 hyper-render），版面交给 CSS。
hyper-render = { version = "0.2.2", default-features = false, features = ["png"] }
# 底图模糊 / 渐变叠加 / 封面与二维码合成 / 最终编码 JPEG。
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# 二维码生成。
qrcode = "0.14"

# 网易云接口走阻塞式 HTTP：命令本来就在独立业务线程里跑，不需要 async runtime。
ureq = "2"
# 表单体百分号编码。
urlencoding = "2"
serde_json = "1"
thiserror = "2"

# 卡片上的日期（month/day）按宿主本地时区取。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
